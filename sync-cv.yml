name: Sync CV from Overleaf

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime via GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download latest PDF from Overleaf
        run: |
          curl -L -o cv.pdf "https://www.overleaf.com/read/dgrqxyfrwkbg#be8ebd/output/output.pdf"

      - name: Commit and Push Updated CV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Auto-update CV from Overleaf" || exit 0
          git push
